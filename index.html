<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Boston Bike Lanes</title>

    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
    <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>

    <style>
        html, body, #map { height: 100%; margin: 0; }
        body { font-family: system-ui, sans-serif; }
        .legend { background: white; padding: 8px 10px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.3); font-size: 13px; line-height: 1.6; }
        .legend h4 { margin: 0 0 4px; font-size: 14px; }
        .legend label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .legend .swatch { display: inline-block; width: 24px; height: 4px; }
        .legend button { border: 0; background: none; cursor: pointer; padding: 0; font: inherit; }
        .legend-open { font-size: 22px; line-height: 1; }
        .legend-close { float: right; margin-left: 12px; font-size: 16px; color: #555; }
        .legend.collapsed { padding: 0; width: 29px; height: 29px; display: flex; align-items: center; justify-content: center; } /* same size as the compass and location buttons */
        .legend.collapsed .legend-body, .legend:not(.collapsed) .legend-open { display: none; }
        .maplibregl-user-location-dot::before { animation: none; } /* no pulsing ring around the blue dot */
    </style>
</head>
<body>
<div id="map"></div>
<script>
    // Roads get one line per side (left/right relative to the OSM way direction);
    // standalone cycleways and paths get a single centered line.
    const TYPES = [
        { key: 'cycleway', label: 'Cycleway (off-road)',     color: '#d4a017' },
        { key: 'track',    label: 'Separated bike lane',     color: '#1a7f37' },
        { key: 'lane',     label: 'Standard bike lane',      color: '#1a7f37' },
        { key: 'path',     label: 'Shared use path',         color: '#1a7f37' },
        { key: 'shared',   label: 'Shared bike lane',        color: '#d1242f' },
    ];
    const colorOf = key => TYPES.find(t => t.key === key).color;
    const colorMatch = prop => ['match', ['get', prop], ...TYPES.flatMap(t => [t.key, t.color]), '#888'];

    // Gap between the two side lines grows with zoom so they stay distinct.
    // Off-road cycleways are drawn twice as thick.
    const thickness = ['case', ['==', ['get', 'kind'], 'cycleway'], 2, 1];
    const width = ['interpolate', ['linear'], ['zoom'],
        12, ['*', thickness, 1.5], 16, ['*', thickness, 3], 19, ['*', thickness, 5]];
    const offset = sign => ['interpolate', ['linear'], ['zoom'], 12, sign * 1.5, 16, sign * 3, 19, sign * 6];

    // The same offsets for the arrow icons, as [x, y] where +y is the right side of the line.
    // x shifts arrows along the line: left-side arrows back and right-side arrows forward by 20px
    // (a quarter of symbol-spacing), so arrows on the two sides of a street alternate instead of overlapping.
    // MapLibre multiplies icon-offset by icon-size, so these are pixel offsets divided by arrowSize.
    const arrowSize = ['interpolate', ['linear'], ['zoom'], 12, 0.35, 13, 0.45, 14, 0.5, 15, 0.6, 18, 1];
    const iconOffset = sign => ['interpolate', ['linear'], ['zoom'],
        ...[[12, 57, 4.3], [13, 44, 4.2], [14, 40, 4.5], [15, 33, 4.3], [16, 27, 4.1], [18, 20, 5], [19, 20, 6]]
            .flatMap(([zoom, x, y]) => [zoom, ['literal', [sign * x, sign * y]]])];

    // `dir` is the property holding the riding direction ('fwd'/'back' along the way), set by addDirections().
    const LAYERS = [
        { id: 'bike-left',   prop: 'left',  dir: 'leftDir',   filter: ['==', ['get', 'kind'], 'road'], offset: offset(-1), iconOffset: iconOffset(-1) },
        { id: 'bike-right',  prop: 'right', dir: 'rightDir',  filter: ['==', ['get', 'kind'], 'road'], offset: offset(1),  iconOffset: iconOffset(1) },
        { id: 'bike-center', prop: 'kind',  dir: 'centerDir', filter: ['!=', ['get', 'kind'], 'road'], offset: 0,          iconOffset: iconOffset(0),
          color: ['case', ['to-boolean', ['get', 'centerDir']], colorOf('track'), colorMatch('kind')],
          arrowType: 'track' },
    ];

    // Riding direction for each side of a road, relative to the way's drawing direction:
    // 'fwd', 'back', 'both' for a two-way lane (double-headed arrows), or null for no arrows.
    // An explicit cycleway:<side>:oneway (or cycleway:both:oneway) tag wins. Otherwise, on a two-way
    // street you ride on the right, so the right side goes forward and the left side backward.
    // On a one-way street both sides go with traffic, except contraflow lanes: "opposite_*" values,
    // or a lane on the left of traffic when bikes may ride both ways (oneway:bicycle=no).
    // Off-road cycleways and paths only get a direction when tagged one-way.
    const onewayDir = v => ['yes', '1'].includes(v) ? 'fwd' : v === '-1' ? 'back' : null;
    function addDirections(data) {
        const flip = d => d === 'fwd' ? 'back' : 'fwd';
        for (const { properties: p } of data.features) {
            const t = p.tags || {};
            const oneway = onewayDir(t.oneway);
            const sideDir = (side, twoWayDir) => {
                if (p.kind !== 'road' || !p[side]) return null;
                const explicit = t[`cycleway:${side}:oneway`] ?? t['cycleway:both:oneway'];
                if (explicit !== undefined) return explicit === 'no' ? 'both' : onewayDir(explicit);
                if (!oneway) return twoWayDir;
                const value = t[`cycleway:${side}`] || t['cycleway:both'] || t.cycleway || '';
                if (value.startsWith('opposite')) return flip(oneway);
                const leftOfTraffic = side === (oneway === 'fwd' ? 'left' : 'right');
                if (t['oneway:bicycle'] === 'no' && leftOfTraffic && p[side] !== 'shared') return flip(oneway);
                return oneway;
            };
            p.leftDir = sideDir('left', 'back');
            p.rightDir = sideDir('right', 'fwd');
            p.centerDir = p.kind === 'road' ? null : oneway;
        }
        return data;
    }

    // Arrow icons, one per color and direction, named like 'arrow-lane-fwd'.
    function arrowImage(color, dir) {
        const size = 80; // drawn at 2x, so 40 CSS pixels
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = size;
        const ctx = canvas.getContext('2d');
        if (dir === 'back') { ctx.translate(size, 0); ctx.scale(-1, 1); }
        ctx.scale(2, 2); // the shape below is drawn on a 40x40 grid
        ctx.beginPath();
        if (dir === 'both') {
            // Double-headed arrow: a head at each end joined by a short shaft.
            ctx.moveTo(2, 20); ctx.lineTo(14, 8); ctx.lineTo(14, 15); ctx.lineTo(26, 15); ctx.lineTo(26, 8);
            ctx.lineTo(38, 20); ctx.lineTo(26, 32); ctx.lineTo(26, 25); ctx.lineTo(14, 25); ctx.lineTo(14, 32);
        } else {
            ctx.moveTo(7, 6); ctx.lineTo(35, 20); ctx.lineTo(7, 34); ctx.lineTo(14, 20);
        }
        ctx.closePath();
        ctx.lineJoin = 'round';
        ctx.lineWidth = 5;
        ctx.strokeStyle = '#fff';
        ctx.stroke();
        ctx.fillStyle = color;
        ctx.fill();
        return ctx.getImageData(0, 0, size, size);
    }

    // Two-finger twist (mobile) or right-click/ctrl-drag left and right (desktop) rotates the map;
    // two fingers sliding up and down (mobile) or right-click/ctrl-drag up and down (desktop) tilts it.
    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://tiles.openfreemap.org/styles/positron',
        center: [-71.121273, 42.342144],
        zoom: 15,
        attributionControl: false, // replaced by the shorter one below so it fits on one line on phones
    });
    map.addControl({
        onAdd: () => Object.assign(document.createElement('div'), {
            className: 'maplibregl-ctrl maplibregl-ctrl-attrib',
            innerHTML: '<div class="maplibregl-ctrl-attrib-inner">' +
                '<a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap</a> &middot; ' +
                '<a href="https://www.openmaptiles.org/" target="_blank">OpenMapTiles</a> &middot; ' +
                '<a href="https://openfreemap.org" target="_blank">OpenFreeMap</a></div>',
        }),
        onRemove: () => {},
    }, 'bottom-right');

    // Legend types that start unchecked.
    const hidden = new Set(['shared']);
    function applyFilters() {
        const visible = ['literal', TYPES.map(t => t.key).filter(k => !hidden.has(k))];
        for (const l of LAYERS) {
            const filter = ['all', l.filter, ['in', ['get', l.prop], visible]];
            map.setFilter(l.id, filter);
            map.setFilter(`${l.id}-arrows`, ['all', filter, ['has', l.dir]]);
        }
    }

    map.on('load', () => {
        for (const t of TYPES) {
            for (const dir of ['fwd', 'back', 'both']) {
                map.addImage(`arrow-${t.key}-${dir}`, arrowImage(t.color, dir), { pixelRatio: 2 });
            }
        }
        map.addSource('bikelanes', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
        fetch('bikelanes.geojson', { cache: 'no-cache' }) // revalidate so a re-fetched data file shows up
            .then(r => r.json())
            .then(data => map.getSource('bikelanes').setData(addDirections(data)));
        // Insert below the basemap's first label layer so street names draw on top of the bike lanes.
        const firstLabel = map.getStyle().layers.find(l => l.type === 'symbol')?.id;
        for (const l of LAYERS) {
            map.addLayer({
                id: l.id,
                type: 'line',
                source: 'bikelanes',
                layout: { 'line-cap': 'butt', 'line-join': 'round' },
                paint: { 'line-color': l.color ?? colorMatch(l.prop), 'line-width': width, 'line-offset': l.offset },
            }, firstLabel);
        }
        for (const l of LAYERS) {
            map.addLayer({
                id: `${l.id}-arrows`,
                type: 'symbol',
                source: 'bikelanes',
                minzoom: 12,
                layout: {
                    'symbol-placement': 'line',
                    'symbol-spacing': 80,
                    'icon-image': ['concat', 'arrow-', l.arrowType ?? ['get', l.prop], '-', ['get', l.dir]],
                    'icon-offset': l.iconOffset,
                    'icon-size': arrowSize,
                    'icon-rotation-alignment': 'map',
                    'icon-allow-overlap': true,
                    'icon-ignore-placement': true,
                },
            }, firstLabel);
        }
        // Darker street names, shifted to the side of the street (in ems, growing with zoom
        // like the bike lane offset) so they don't cover the bike lanes.
        const labelOffset = ['interpolate', ['linear'], ['zoom'],
            12, ['literal', [0, 1.0]], 16, ['literal', [0, 1.3]], 19, ['literal', [0, 1.6]]];
        for (const id of ['highway-name-path', 'highway-name-minor', 'highway-name-major']) {
            if (!map.getLayer(id)) continue;
            map.setPaintProperty(id, 'text-color', '#333');
            map.setLayoutProperty(id, 'text-offset', labelOffset);
        }
        applyFilters();
    });

    const sideLabel = v => v ? TYPES.find(t => t.key === v).label : 'none';

    map.on('click', e => {
        const box = [[e.point.x - 5, e.point.y - 5], [e.point.x + 5, e.point.y + 5]];
        const f = map.queryRenderedFeatures(box, { layers: LAYERS.map(l => l.id) })[0];
        if (!f) return;
        const p = f.properties;
        const tags = JSON.parse(p.tags || '{}');
        const detail = p.kind === 'road'
            ? `Left: ${sideLabel(p.left)}<br>Right: ${sideLabel(p.right)}`
            : sideLabel(p.kind);
        new maplibregl.Popup().setLngLat(e.lngLat).setHTML(
            `<strong>${p.name || 'Unnamed'}</strong><br>${detail}<br>` +
            `<code>${Object.entries(tags).map(([k, v]) => `${k}=${v}`).join('<br>')}</code><br>` +
            `<a href="https://www.openstreetmap.org/way/${p.id}" target="_blank">View on OSM</a>`
        ).addTo(map);
    });
    for (const l of LAYERS) {
        map.on('mouseenter', l.id, () => map.getCanvas().style.cursor = 'pointer');
        map.on('mouseleave', l.id, () => map.getCanvas().style.cursor = '');
    }

    // Starts collapsed to the ℹ️ button; tapping it opens the legend, ✕ closes it.
    const legend = document.createElement('div');
    legend.className = 'maplibregl-ctrl legend collapsed';
    // legend.innerHTML = '<h4>Boston, Brookline &amp; Cambridge Bike Lanes</h4>' + TYPES.map(t => `
    legend.innerHTML = '<button class="legend-open" aria-label="Show legend">ℹ️</button>' +
        '<div class="legend-body"><button class="legend-close" aria-label="Hide legend">✕</button>' +
        TYPES.map(t => `
        <label>
            <input type="checkbox" data-key="${t.key}" ${hidden.has(t.key) ? '' : 'checked'}>
            <span class="swatch" style="background: ${t.color}"></span>
            ${t.label}
        </label>`).join('') + '</div>';
    legend.querySelector('.legend-open').addEventListener('click', () => legend.classList.remove('collapsed'));
    legend.querySelector('.legend-close').addEventListener('click', () => legend.classList.add('collapsed'));
    legend.addEventListener('change', e => {
        e.target.checked ? hidden.delete(e.target.dataset.key) : hidden.add(e.target.dataset.key);
        applyFilters();
    });
    map.addControl({ onAdd: () => legend, onRemove: () => legend.remove() }, 'top-right');
    // Added after the legend so they stack under the ℹ️ button.
    // Compass only (no +/- buttons); it shows the current rotation and tilt, and tapping it
    // turns the map back to north and flat.
    map.addControl(new maplibregl.NavigationControl({ showZoom: false, visualizePitch: true }), 'top-right');
    // Location button: tapping it asks for permission, then shows a blue dot that follows the viewer
    // (with a cone showing which way they face, on devices that report it).
    map.addControl(new maplibregl.GeolocateControl({
        positionOptions: { enableHighAccuracy: true },
        trackUserLocation: true,
        showUserHeading: true,
    }), 'top-right');
</script>
</body>
</html>
